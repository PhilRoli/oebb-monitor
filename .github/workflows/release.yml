name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch: # started by dependabot-release.yml, run on the tag ref

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Never ship something that doesn't match its tag or fails its own tests.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tag matches Cargo.toml version
        run: |
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "Releases must run on a tag ref, got ${GITHUB_REF}." >&2; exit 1
          fi
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${GITHUB_REF_NAME}" != "v${crate}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}." >&2; exit 1
          fi

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          ARCHIVE="oebb-monitor-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" oebb-monitor
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # build provenance
      attestations: write  # build provenance
    outputs:
      arm64_sha256:  ${{ steps.sha.outputs.arm64 }}
      x86_64_sha256: ${{ steps.sha.outputs.x86_64 }}
      linux_sha256:  ${{ steps.sha.outputs.linux }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true

      - name: Compute checksums
        id: sha
        run: |
          echo "arm64=$(shasum  -a 256 oebb-monitor-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64=$(shasum -a 256 oebb-monitor-x86_64-apple-darwin.tar.gz  | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux=$(shasum  -a 256 oebb-monitor-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: oebb-monitor-*.tar.gz

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: oebb-monitor-*.tar.gz

  # Not allowed to fail silently: a broken tap means `brew upgrade` users never
  # get the release, so let the workflow go red.
  update-tap:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          VERSION:    ${{ github.ref_name }}
          ARM64_SHA:  ${{ needs.release.outputs.arm64_sha256 }}
          X86_64_SHA: ${{ needs.release.outputs.x86_64_sha256 }}
          LINUX_SHA:  ${{ needs.release.outputs.linux_sha256 }}
          REPO:       ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import os, re, sys

          version = os.environ['VERSION'].lstrip('v')
          arm64   = os.environ['ARM64_SHA']
          x86_64  = os.environ['X86_64_SHA']
          linux   = os.environ['LINUX_SHA']
          repo    = os.environ['REPO']
          base    = f"https://github.com/{repo}/releases/download/v{version}"

          path = 'Formula/oebb-monitor.rb'
          text = open(path).read()

          def sub(pattern, replacement):
              global text
              text, n = re.subn(pattern, replacement, text)
              if n != 1:
                  sys.exit(f"formula pattern matched {n} times (expected 1): {pattern}")

          sub(r'version "[^"]*"', f'version "{version}"')
          # Anchor on the asset names: on_intel appears under both macOS and Linux.
          for blockkey, asset, sha in [
              ('on_arm', 'aarch64-apple-darwin', arm64),
              ('on_intel', 'x86_64-apple-darwin', x86_64),
              ('on_intel', 'x86_64-unknown-linux-gnu', linux),
          ]:
              name = f'oebb-monitor-{asset}.tar.gz'
              sub(rf'({blockkey} do\n\s+url ")[^"]*{re.escape(name)}"',
                  rf'\g<1>{base}/{name}"')
              sub(rf'({blockkey} do\n\s+url "[^"]*{re.escape(name)}"\n\s+sha256 ")[^"]*"',
                  rf'\g<1>{sha}"')

          open(path, 'w').write(text)
          print(f"Updated formula to v{version}")
          EOF

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/oebb-monitor.rb
          git diff --staged --quiet || git commit -m "oebb-monitor $TAG"
          git push
