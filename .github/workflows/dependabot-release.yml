name: Dependabot release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged Dependabot PR to release for
        required: true

jobs:
  # Reached by dispatch (after an auto-merge) or when a Dependabot PR is merged by hand.
  # A merged Dependabot PR that changed Cargo.toml/Cargo.lock ships a new patch
  # version (0.x.Y+1), whatever the kind of dependency bump. Tags pushed with
  # GITHUB_TOKEN don't start other workflows, so the release workflow is dispatched.
  release:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'closed' && github.event.pull_request.merged == true
          && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Decide on a release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if ! gh pr diff "$PR_NUMBER" --name-only | grep -qE '^Cargo\.(toml|lock)$'; then
            echo "No Cargo changes in this PR, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          if git ls-remote --exit-code --tags origin "v$next" >/dev/null 2>&1; then
            echo "Tag v$next already exists, not releasing." >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $current -> $next"

      - name: Bump version, tag and push
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          sed -i -E '0,/^version = "[^"]*"/s//version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "oebb-monitor v$VERSION"
          git push --atomic origin main "v$VERSION"

      - name: Start the release build
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
