[package]
name = "oebb-monitor"
version = "0.2.7"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "oebb-monitor"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Only here to pick the `ring` crypto provider for tokio-tungstenite's rustls, which
# otherwise panics at the first TLS handshake ("could not determine CryptoProvider").
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
chrono = "0.4"
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "test-util"] }
tempfile = "3"
